<!DOCTYPE html><html lang="it"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Quiz Sistema Solare</title><style>body{font-family:Arial,sans-serif;background:#081229;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}#card{background:#132b63;padding:24px;border-radius:16px;max-width:700px;width:90%}button{display:block;width:100%;margin:8px 0;padding:12px;border:none;border-radius:8px}h1{text-align:center}</style></head><body><div id="card"></div><script>const q=[{q:'Qual è il pianeta più vicino al Sole?',a:['Venere','Mercurio','Marte'],c:1},{q:'Qual è il pianeta rosso?',a:['Marte','Venere','Giove'],c:0},{q:'Qual è il pianeta più grande?',a:['Terra','Giove','Saturno'],c:1}];let i=0,s=0;function r(){if(i>=q.length){card.innerHTML='<h1>Risultato</h1><h2>'+s+'/'+q.length+'</h2><button onclick="location.reload()">Ricomincia</button>';return;}let x=q[i];card.innerHTML='<h1>🌌 Quiz Sistema Solare</h1><h2>Domanda '+(i+1)+'</h2><p>'+x.q+'</p>'+x.a.map((v,n)=>'<button onclick="ans('+n+')">'+v+'</button>').join('');}function ans(n){if(n===q[i].c)s++;i++;r();}const card=document.getElementById('card');r();</script></body></html>
